name: 'Publish new release'

on:
  push:
    tags: ['v*']

# This workflow will trigger on each push of a tag that starts with a "v" to create or update a GitHub release, build your app, and upload the artifacts to the release.
# Useful links:
# https://github.com/marketplace/actions/build-and-upload-rust-binary-to-github-releases
# https://github.com/marketplace/actions/rust-release-binary
# https://github.com/cargo-bins/cargo-binstall/blob/main/.github/workflows/release-packages.yml
# https://github.com/trunk-rs/trunk/blob/main/.github/workflows/release.yaml
# https://goreleaser.com/quick-start/

env:
  binary_name: firefox-session-ui-iced

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            target: 'aarch64-apple-darwin'

          - platform: 'macos-latest' # for Intel based macs.
            target: 'x86_64-apple-darwin'

          - platform: 'ubuntu-latest'
            target: 'x86_64-unknown-linux-gnu'

          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            ext: '.exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Post Build | Move binary
        run: |
          mkdir uploads
          mv target/${{ matrix.target }}/release/${{ env.binary_name }}${{ matrix.ext }} uploads/${{ env.binary_name }}${{ matrix.ext }}

      - name: Post Build | Prepare artifacts [zip]
        if: matrix.platform == 'windows-latest'
        working-directory: uploads
        run: |
          7z a ${{ env.binary_name }}-${{ matrix.target }}.zip ${{ env.binary_name }}${{ matrix.ext }}

      - name: Post Build | Prepare artifacts [tar.gz]
        if: matrix.platform != 'windows-latest'
        working-directory: uploads
        run: |
          tar --create --gzip --verbose --file  ${{ env.binary_name }}-${{ matrix.target }}.tar.gz ${{ env.binary_name }}${{ matrix.ext }}

      - name: Post Build | Remove binary (now inside compressed artifact)
        working-directory: uploads
        run: |
          rm ${{ env.binary_name }}${{ matrix.ext }}

      - name: Post Build | Display structure of uploads folder
        run: ls uploads

      - name: Post Build | Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.binary_name }}-${{ matrix.target }}
          path: uploads/*
          retention-days: 1
          if-no-files-found: error

  # Build flatpak, see: https://github.com/flatpak/flatpak-github-actions
  build-flatpak:
    name: "Flatpak (${{ matrix.variant.arch }})"
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.variant.runner }}

    container:
      # Use an image generated by Flathub to avoid re-installing the SDKs for every build,
      # see: https://github.com/flathub-infra/actions-images
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install flatpak-cargo-generator
        run: |
          python3 -m pip install --break-system-packages flatpak-cargo-generator

      - name: Generate Cargo Sources
        run: |
          chmod +x ./flatpak/generate-sources.sh
          ./flatpak/generate-sources.sh

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/flatpak-builder.yaml
          bundle: firefox-session-ui-iced-${{ matrix.variant.arch }}.flatpak
          arch: ${{ matrix.variant.arch }}
          upload-artifact: true
          cache-key: flatpak-builder-${{ github.sha }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, build-flatpak]
    permissions:
      contents: write
    steps:
      - name: Download binary from previous job
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls artifacts

      # Upload release asset:  https://github.com/actions/upload-release-asset
      # which recommends:      https://github.com/softprops/action-gh-release
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: artifacts/*
